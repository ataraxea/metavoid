[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "metavoid"
version = "0.1.0"
description = "A cross-platform CLI tool for inspecting and removing file metadata."
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[project.scripts]
metavoid = "metavoid.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/metavoid"]